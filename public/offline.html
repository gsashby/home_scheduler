<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Home Scheduler</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #ffffff;
        color: #1f2937;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f3f4f6;
        }
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        color: inherit;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Today's schedule will reappear once you're back online.</p>
    </div>
  </body>
</html>
